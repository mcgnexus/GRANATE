name: e2e

on:
  workflow_dispatch:
  deployment_status:

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || secrets.E2E_BASE_URL }}
          GRANATE_E2E_EMAIL: ${{ secrets.GRANATE_E2E_EMAIL }}
          GRANATE_E2E_PASSWORD: ${{ secrets.GRANATE_E2E_PASSWORD }}

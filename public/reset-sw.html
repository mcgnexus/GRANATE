<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Limpiar caché · GRANATE</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #120f0e;
        color: #ece4d9;
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 2rem;
      }
      .card {
        max-width: 30rem;
        border: 1px solid #352b27;
        background: #1b1615;
        border-radius: 16px;
        padding: 2rem;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-bottom: 1rem;
        border-radius: 12px;
        background: #b23a48;
        font-weight: 700;
        color: #fff;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.5rem;
        margin: 0 0 0.6rem;
      }
      p,
      li {
        color: #9a8b7d;
        line-height: 1.6;
        font-size: 0.9rem;
      }
      button,
      a.button {
        display: inline-block;
        margin-top: 1rem;
        border: 0;
        border-radius: 9px;
        padding: 0.65rem 1rem;
        background: #b23a48;
        color: #fff;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      code {
        background: #221b19;
        padding: 0.1rem 0.35rem;
        border-radius: 5px;
        font-size: 0.8rem;
      }
      #status {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #c9a227;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">G</div>
      <h1>Limpiar caché de GRANATE</h1>
      <p>
        Esta página desregistra los service workers antiguos y borra las cachés del navegador. No
        cierra tu sesión ni borra tus notas (están en Neon).
      </p>
      <p id="status">Limpiando…</p>
      <a class="button" href="/vaults">Volver a la bóveda</a>
      <p style="margin-top: 1.4rem; font-size: 0.8rem">
        Si el problema continúa: DevTools → <code>Application</code> → <code>Storage</code> →
        <code>Clear site data</code>.
      </p>
    </div>
    <script>
      (async () => {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          status.textContent = "Caché limpiada. Redirigiendo…";
          window.setTimeout(() => {
            window.location.replace("/vaults");
          }, 900);
        } catch (error) {
          status.textContent = "No se pudo limpiar automáticamente: " + error.message;
        }
      })();
    </script>
  </body>
</html>
